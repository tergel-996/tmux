# Prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ----- Copy Mode (Vi-style like Neovim) -----
set-window-option -g mode-keys vi

# Open scrollback in nvim (instead of copy mode)
bind [ run-shell 'tmux capture-pane -S -10000 -p | sed "/^[[:space:]]*$/d" > /tmp/tmux-buffer' \; new-window "nvim '+normal G' /tmp/tmux-buffer"

# Selection bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# More nvim-like bindings in copy mode
bind-key -T copy-mode-vi 'C-h' send-keys -X cursor-left
bind-key -T copy-mode-vi 'C-j' send-keys -X cursor-down
bind-key -T copy-mode-vi 'C-k' send-keys -X cursor-up
bind-key -T copy-mode-vi 'C-l' send-keys -X cursor-right

# Word navigation (like nvim)
bind-key -T copy-mode-vi 'w' send-keys -X next-word
bind-key -T copy-mode-vi 'e' send-keys -X next-word-end
bind-key -T copy-mode-vi 'b' send-keys -X previous-word

# Jump to start/end
bind-key -T copy-mode-vi 'H' send-keys -X top-line
bind-key -T copy-mode-vi 'M' send-keys -X middle-line
bind-key -T copy-mode-vi 'L' send-keys -X bottom-line

# Search (like nvim)
bind-key -T copy-mode-vi '/' command-prompt -p "(search down)" "send -X search-forward \"%%%\""
bind-key -T copy-mode-vi '?' command-prompt -p "(search up)" "send -X search-backward \"%%%\""
bind-key -T copy-mode-vi 'n' send-keys -X search-again
bind-key -T copy-mode-vi 'N' send-keys -X search-reverse

# Paging
bind-key -T copy-mode-vi 'C-u' send-keys -X halfpage-up
bind-key -T copy-mode-vi 'C-d' send-keys -X halfpage-down
bind-key -T copy-mode-vi 'C-b' send-keys -X page-up
bind-key -T copy-mode-vi 'C-f' send-keys -X page-down

# Line navigation
bind-key -T copy-mode-vi '0' send-keys -X start-of-line
bind-key -T copy-mode-vi '^' send-keys -X back-to-indentation
bind-key -T copy-mode-vi '$' send-keys -X end-of-line

# Copy to system clipboard (works with tmux-yank plugin)
bind-key -T copy-mode-vi 'Y' send-keys -X copy-pipe-and-cancel "pbcopy"

# Open scrollback buffer in nvim
bind e run-shell 'tmux capture-pane -S -10000 -p | sed "/^[[:space:]]*$/d" > /tmp/tmux-buffer' \; new-window "nvim '+normal G' /tmp/tmux-buffer"

# 1-based indexing
set -g base-index 1
set -g pane-base-index 1

# looks
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"


# status bar
set -g status-style bg=default,fg=white,bright
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"

# windows buttons
set -g window-status-format " #I "
set -g window-status-current-format " #I "
set -g window-status-current-style "fg=magenta,nobold"
set -g window-status-bell-style "fg=red,nobold"

# panes
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

# options
set -g renumber-windows on
set -g automatic-rename-format '#{b:pane_current_path}:#{pane_current_command}'
set -g escape-time 0
set -g mouse on
set -g repeat-time 1000
set -g history-limit 10000

# ----- New Keybindings -----

# ----- Session Management (UPPERCASE) -----
# Create new session
bind C command-prompt -p "New session name:" "new-session -s '%%'"

# Kill current session and switch to another
bind K confirm-before -p "Kill session #S? (y/n)" kill-session

# Rename current session
bind R command-prompt -I "#S" "rename-session '%%'"

# Switch to last session
bind L switch-client -l

# Switch to previous/next session
bind -r N switch-client -n
bind -r P switch-client -p

# Choose session from list
bind s display-popup -E -w 80% -h 60% "~/.config/tmux/scripts/session-switcher.sh"

# Switch to session by name (type name directly)
bind g command-prompt -p "Switch to session:" "switch-client -t '%%'"

# ----- Window Management (lowercase) -----
# Create new window
unbind c
bind c new-window -c "#{pane_current_path}"

# Kill window
bind k confirm-before -p "Kill window #W? (y/n)" kill-window

# Rename window
bind r command-prompt -I "#W" "rename-window '%%'"

# Switch to last window
bind l last-window

# Switch to previous/next window
bind -r n previous-window
bind -r m next-window

# Move window left/right
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# Choose window from list
bind w choose-window

# ----- Pane Management -----
# Split panes with 'h' and 'v' open panes current dir
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# Kill pane without confirmation
bind x kill-pane


# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'powerline/default/gray'

# tmux-fzf configuration
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="f"

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
